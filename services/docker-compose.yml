version: "3.9"

# =============================================================================
# Codechecker Security Platform – Complete Docker Compose Stack
#
# Standalone microservices + Web Cockpit GUI.
# All data/models/DBs are baked directly into the container images.
# Run from repo root:  docker compose -f services/docker-compose.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. Qdrant Vector Database
  #    206,000+ CWE/CVE vulnerability vectors baked into the image.
  # ---------------------------------------------------------------------------
  qdrant:
    build:
      context: ..
      dockerfile: services/Dockerfile.qdrant
    image: codechecker-qdrant:latest
    container_name: codechecker-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web Dashboard
      - "6334:6334"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 2. SAST – CWE/CVE Threat Attribution Engine (GPU accelerated)
  #    Jina Code Embeddings 1.5B + NVD index baked into the image.
  #    Connects to the qdrant service over the internal Docker network.
  # ---------------------------------------------------------------------------
  sast-api:
    build:
      context: ..
      dockerfile: services/Dockerfile.sast
    image: codechecker-sast:latest
    container_name: codechecker-sast
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8080"   # REST API + Web Dashboard
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health | grep -q healthy"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # 3. SCA – Universal 13-Language Dependency Vulnerability Engine
  #    SQLite OSV database (305k+ advisories) baked into the image.
  # ---------------------------------------------------------------------------
  sca-api:
    build:
      context: ..
      dockerfile: services/Dockerfile.sca
    image: codechecker-sca:latest
    container_name: codechecker-sca
    restart: unless-stopped
    ports:
      - "8082:8082"   # REST API + Web Dashboard
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 4. Web Cockpit – Cyberpunk React GUI & Review Orchestrator
  # ---------------------------------------------------------------------------
  web-cockpit:
    build:
      context: ..
      dockerfile: services/Dockerfile.ui
    image: codechecker-ui:latest
    container_name: codechecker-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-5433}:5432"
    volumes:
      - ../models:/models:ro
    environment:
      - PORT=5432
      - NODE_ENV=production
      - OCR_PATH=/usr/local/bin/ocr
      - MODELS_DIR=/models
      - QBIT_ENRICHER_URL=http://sast-api:8080
      - SCA_URL=http://sca-api:8082
      - VLLM_URL=http://${VLLM_HOST:-host.docker.internal}:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sca-api:
        condition: service_healthy
      sast-api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 5. vLLM Inference Engine (GPU) – Activated via --profile vllm
  #    Change models dynamically with:
  #      MODEL_PATH=/path/to/weights MODEL_NAME=my-model docker compose --profile vllm up -d
  # ---------------------------------------------------------------------------
  vllm:
    profiles: ["vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.20.1}
    container_name: codechecker-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${MODEL_PATH:-../models/qwen2.5-coder-7b-instruct-awq}:/model:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    command: >
      /model
      --served-model-name ${MODEL_NAME:-qwen2.5-coder-7b-instruct}
      --port 8000
      --max-model-len ${MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.58}
      --enforce-eager
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  default:
    name: codechecker-net
