version: "3.9"

# =============================================================================
# Codechecker Security Platform – Single Docker Compose
#
# Three standalone services. All data/models/DBs are baked into the images.
# Run from the repo root:  docker compose -f docker/docker-compose.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. Qdrant Vector Database
  #    206,000+ CWE/CVE vulnerability vectors baked into the image.
  # ---------------------------------------------------------------------------
  qdrant:
    build:
      context: ..                         # repo root is the build context
      dockerfile: services/Dockerfile.qdrant
    image: codechecker-qdrant:latest
    container_name: codechecker-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web Dashboard
      - "6334:6334"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. SAST – CWE/CVE Threat Attribution Engine (GPU accelerated)
  #    Jina Code Embeddings 1.5B + NVD index baked into the image.
  #    Connects to the qdrant service over the internal Docker network.
  # ---------------------------------------------------------------------------
  sast-api:
    build:
      context: ..
      dockerfile: services/Dockerfile.sast
    image: codechecker-sast:latest
    container_name: codechecker-sast
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8080"   # REST API + Web Dashboard
    environment:
      - QDRANT_HOST=qdrant      # Docker service name resolves on the network
      - QDRANT_PORT=6333
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health | grep -q healthy"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 3. SCA – Universal 13-Language Dependency Vulnerability Engine
  #    SQLite OSV database (185k+ advisories) baked into the image.
  #    CPU-only, lightweight.
  # ---------------------------------------------------------------------------
  sca-api:
    build:
      context: ../API_qdrant_Vul_db/vul_packages
      dockerfile: ../../services/Dockerfile.sca
    image: codechecker-sca:latest
    container_name: codechecker-sca
    restart: unless-stopped
    ports:
      - "8082:8082"   # REST API + Web Dashboard
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  default:
    name: codechecker-net

